description: |
  Agentic Robotic Software System. The self-hosted autonomous task agent you can actually trust with a shell — and now with a body. Delegate a job from your desk, watch it work in a real UI, approve the risky steps, and get pinged when it's done. Runs on Claude, GPT, Grok — or fully local Ollama when privacy matters. And LumaKit doesn't stop at the desk. It is the mind of the VISITOR LX-1 Builders Edition robot (lumalien.com): the same agent that fixes your repo can roll through your home, look through a real camera and describe what it actually sees, and remember the rooms, objects, and routines it finds — while every safety-critical reflex runs on the robot itself, never on the model. The robot's onboard stack is open source too: LumaBot. One agent, from your terminal to your living room floor. Primary language: python; observed outbound integrations: api.openai.com, api.anthropic.com, serpapi.com, self-hosted inference.
