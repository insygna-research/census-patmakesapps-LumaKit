[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "lumakit"
version = "0.1.0"
description = "Self-hosted autonomous task agent — bring Claude, GPT, Grok, or local Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dynamic = ["dependencies"]

[project.optional-dependencies]
browser = ["playwright==1.59.0"]
desktop = ["PyAutoGUI==0.9.54", "pyperclip==1.11.0"]
speech = ["edge-tts==7.2.8"]
all = [
    "playwright==1.59.0",
    "PyAutoGUI==0.9.54",
    "pyperclip==1.11.0",
    "edge-tts==7.2.8",
]

[project.urls]
Homepage = "https://github.com/patmakesapps/LumaKit"
Repository = "https://github.com/patmakesapps/LumaKit"

[project.scripts]
lumakit = "lumakit:main"

[tool.setuptools]
py-modules = ["agent", "lumakit", "ollama_client", "tool_registry"]

[tool.setuptools.packages.find]
include = ["core*", "surfaces*", "tools*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
